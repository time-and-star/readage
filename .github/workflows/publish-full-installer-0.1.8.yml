name: Upload verified ReadAge 0.1.8 installers and APK deltas
"on":
  push:
    branches:
      - codex/full-installer-release-0.1.8
    paths:
      - .github/workflows/publish-full-installer-0.1.8.yml
permissions: {}
concurrency:
  group: readage-full-installer-0.1.8
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'time-and-star/readage' && github.ref == 'refs/heads/codex/full-installer-release-0.1.8' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: time-and-star/readage
      TARGET_COMMIT: e5351fe2f24abdf774077ed6437e468319ec16cd
      DRAFT_RELEASE_ID: "416866271"
    steps:
      - name: Download, verify and upload six pinned assets to the fixed draft
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = time-and-star/readage
          test "$GITHUB_REF" = refs/heads/codex/full-installer-release-0.1.8
          test "$GITHUB_EVENT_NAME" = push
          test "$TARGET_COMMIT" != __FIXED_SOURCE_COMMIT_REQUIRED__
          test "$DRAFT_RELEASE_ID" != __FIXED_DRAFT_RELEASE_ID_REQUIRED__
          work=$(mktemp -d -t readage-0.1.8.XXXXXXXX)
          trap 'rm -rf -- "$work"' EXIT
          cd "$work"
          check_release() {
            release=$(gh api "repos/time-and-star/readage/releases/$DRAFT_RELEASE_ID")
            jq -e --argjson id "$DRAFT_RELEASE_ID" --arg target "$TARGET_COMMIT" \
              '.id == $id and .draft == true and .tag_name == "v0.1.8" and .target_commitish == $target' \
              <<< "$release" >/dev/null
          }
          verify_asset() {
            jq -e --arg name "$name" --arg sha "sha256:$sha" --argjson bytes "$bytes" \
              '[.assets[] | select(.name == $name)] as $items | ($items | length) == 1 and $items[0].state == "uploaded" and $items[0].size == $bytes and $items[0].digest == $sha' \
              <<< "$release" >/dev/null
          }
          check_release
          while read -r sha bytes name; do
            check_release
            count=$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<< "$release")
            if test "$count" -ne 0; then
              verify_asset
              printf 'Already verified: %s\n' "$name"
              continue
            fi
            curl --fail --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
              --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
              --speed-time 60 --speed-limit 1024 --header 'Accept-Encoding: identity' \
              --output "$name.part" "https://readage.xyz/downloads/$name"
            test "$(stat -c '%s' "$name.part")" = "$bytes"
            printf '%s  %s\n' "$sha" "$name.part" | sha256sum --check
            check_release
            uploaded=$(gh api --method POST "https://uploads.github.com/repos/time-and-star/readage/releases/$DRAFT_RELEASE_ID/assets?name=$name" \
              --header 'Content-Type: application/octet-stream' --input "$name.part")
            jq -e --arg name "$name" --arg sha "sha256:$sha" --argjson bytes "$bytes" \
              '.name == $name and .size == $bytes and .state == "uploaded" and .digest == $sha' <<< "$uploaded" >/dev/null
            check_release
            verify_asset
            rm -- "$name.part"
            printf 'Uploaded and verified: %s\n' "$name"
          done <<'READAGE_VERIFIED_ASSETS'
          411f0ee5782d6a222840a1f8d307ddf99fa8d3bdcfe7c39600d7192726eb7a5a 1335407891 ReadAge-0.1.8-windows-x64-setup.exe
          41a6da7d3a4df762c832abcb8e7ea059e490a0aa4e7e8c92b79af4425dbfa60d 33362163 ReadAge-0.1.8-windows-x64-setup.exe.from-6800754ad357ed8034b518e61979b07046133c323f6c54aceb2e559f67411409.delta
          2d7d9ac20b526fadf337666368633a20d382f2f60ebd9752889b81eed42efed0 1421 ReadAge-0.1.8-windows-x64-setup.exe.from-6800754ad357ed8034b518e61979b07046133c323f6c54aceb2e559f67411409.delta.json
          c735f54a30c8e98fea0bdbe16a54eca543879a698601fa608c5521d20bd72737 1740942711 ReadAge-1.0.10-android.apk
          487a93b8240f21906fc982926fd62bdf4110b26f68f92e0cb20ff9142ba54b1e 1662626 ReadAge-1.0.10-android.apk.from-1b5b332075ba2a513e907ca797bb6b0e6277834d5f7f3c99616259535338516c.delta
          d36fbc1d38966022df8f5bcc13542af676c75786d3afcf05fbd86bc1f0ed959f 1679 ReadAge-1.0.10-android.apk.from-1b5b332075ba2a513e907ca797bb6b0e6277834d5f7f3c99616259535338516c.delta.json
          READAGE_VERIFIED_ASSETS
          check_release
          while read -r sha bytes name; do
            verify_asset
          done <<'READAGE_FINAL_ASSETS'
          411f0ee5782d6a222840a1f8d307ddf99fa8d3bdcfe7c39600d7192726eb7a5a 1335407891 ReadAge-0.1.8-windows-x64-setup.exe
          41a6da7d3a4df762c832abcb8e7ea059e490a0aa4e7e8c92b79af4425dbfa60d 33362163 ReadAge-0.1.8-windows-x64-setup.exe.from-6800754ad357ed8034b518e61979b07046133c323f6c54aceb2e559f67411409.delta
          2d7d9ac20b526fadf337666368633a20d382f2f60ebd9752889b81eed42efed0 1421 ReadAge-0.1.8-windows-x64-setup.exe.from-6800754ad357ed8034b518e61979b07046133c323f6c54aceb2e559f67411409.delta.json
          c735f54a30c8e98fea0bdbe16a54eca543879a698601fa608c5521d20bd72737 1740942711 ReadAge-1.0.10-android.apk
          487a93b8240f21906fc982926fd62bdf4110b26f68f92e0cb20ff9142ba54b1e 1662626 ReadAge-1.0.10-android.apk.from-1b5b332075ba2a513e907ca797bb6b0e6277834d5f7f3c99616259535338516c.delta
          d36fbc1d38966022df8f5bcc13542af676c75786d3afcf05fbd86bc1f0ed959f 1679 ReadAge-1.0.10-android.apk.from-1b5b332075ba2a513e907ca797bb6b0e6277834d5f7f3c99616259535338516c.delta.json
          READAGE_FINAL_ASSETS
          printf 'All 6 pinned installer/delta assets verified on the fixed draft release.\n'
