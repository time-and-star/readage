name: Upload verified ReadAge 0.1.9 installers and APK deltas
"on":
  push:
    branches:
      - codex/full-installer-release-0.1.9
    paths:
      - .github/workflows/publish-full-installer-0.1.9.yml
permissions: {}
concurrency:
  group: readage-full-installer-0.1.9
  cancel-in-progress: false
jobs:
  upload:
    if: github.repository == 'time-and-star/readage' && github.ref == 'refs/heads/codex/full-installer-release-0.1.9' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: time-and-star/readage
      TARGET_COMMIT: 6758b4dcf59ce711616d7bb16d348121441ca052
      DRAFT_RELEASE_ID: "418006022"
    steps:
      - name: Download, verify and upload six pinned assets to the fixed draft
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = time-and-star/readage
          test "$GITHUB_REF" = refs/heads/codex/full-installer-release-0.1.9
          test "$GITHUB_EVENT_NAME" = push
          test "$TARGET_COMMIT" != __FIXED_SOURCE_COMMIT_REQUIRED__
          test "$DRAFT_RELEASE_ID" != __FIXED_DRAFT_RELEASE_ID_REQUIRED__
          work=$(mktemp -d -t readage-0.1.9.XXXXXXXX)
          trap 'rm -rf -- "$work"' EXIT
          cd "$work"
          check_release() {
            release=$(gh api "repos/time-and-star/readage/releases/$DRAFT_RELEASE_ID")
            jq -e --argjson id "$DRAFT_RELEASE_ID" --arg target "$TARGET_COMMIT" \
              '.id == $id and .draft == true and .tag_name == "v0.1.9" and .target_commitish == $target' \
              <<< "$release" >/dev/null
          }
          verify_asset() {
            jq -e --arg name "$name" --arg sha "sha256:$sha" --argjson bytes "$bytes" \
              '[.assets[] | select(.name == $name)] as $items | ($items | length) == 1 and $items[0].state == "uploaded" and $items[0].size == $bytes and $items[0].digest == $sha' \
              <<< "$release" >/dev/null
          }
          check_release
          while read -r sha bytes name; do
            check_release
            count=$(jq -r --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<< "$release")
            if test "$count" -ne 0; then
              verify_asset
              printf 'Already verified: %s\n' "$name"
              continue
            fi
            curl --fail --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
              --retry 5 --retry-all-errors --connect-timeout 30 --max-time 1800 \
              --speed-time 60 --speed-limit 1024 --header 'Accept-Encoding: identity' \
              --output "$name.part" "https://readage.xyz/downloads/$name"
            test "$(stat -c '%s' "$name.part")" = "$bytes"
            printf '%s  %s\n' "$sha" "$name.part" | sha256sum --check
            check_release
            uploaded=$(gh api --method POST "https://uploads.github.com/repos/time-and-star/readage/releases/$DRAFT_RELEASE_ID/assets?name=$name" \
              --header 'Content-Type: application/octet-stream' --input "$name.part")
            jq -e --arg name "$name" --arg sha "sha256:$sha" --argjson bytes "$bytes" \
              '.name == $name and .size == $bytes and .state == "uploaded" and .digest == $sha' <<< "$uploaded" >/dev/null
            check_release
            verify_asset
            rm -- "$name.part"
            printf 'Uploaded and verified: %s\n' "$name"
          done <<'READAGE_VERIFIED_ASSETS'
          d750de8ad7d3ade8d7b57857a3b16fd43578b3967e86beecb2a981a3f565a00e 1335415446 ReadAge-0.1.9-windows-x64-setup.exe
          0ceaac4c0ae62a1a24f5563d225e14c52f31ad61b7d1da12a6fa5a3b2e0061cb 135351828 ReadAge-0.1.9-windows-x64-setup.exe.from-411f0ee5782d6a222840a1f8d307ddf99fa8d3bdcfe7c39600d7192726eb7a5a.delta
          efa905cdca30205973a5da131bfc50448e195b2cffbcdddbe17308acb6cb50c0 5027 ReadAge-0.1.9-windows-x64-setup.exe.from-411f0ee5782d6a222840a1f8d307ddf99fa8d3bdcfe7c39600d7192726eb7a5a.delta.json
          2686057a00fadd3d71f182e21bad56a0283eca21f2f0017195c8a38e9efe3fbe 1740948318 ReadAge-1.0.11-android.apk
          25cde774464682c03b1f97663068a9f7d3cc4f13899dbbd90af68b9c43274f60 3053163 ReadAge-1.0.11-android.apk.from-c735f54a30c8e98fea0bdbe16a54eca543879a698601fa608c5521d20bd72737.delta
          321856e6a09b5ef19746bfd897ffc1cf88cffadb6c52542bb095dc7f9b4431e1 1726 ReadAge-1.0.11-android.apk.from-c735f54a30c8e98fea0bdbe16a54eca543879a698601fa608c5521d20bd72737.delta.json
          READAGE_VERIFIED_ASSETS
          check_release
          while read -r sha bytes name; do
            verify_asset
          done <<'READAGE_FINAL_ASSETS'
          d750de8ad7d3ade8d7b57857a3b16fd43578b3967e86beecb2a981a3f565a00e 1335415446 ReadAge-0.1.9-windows-x64-setup.exe
          0ceaac4c0ae62a1a24f5563d225e14c52f31ad61b7d1da12a6fa5a3b2e0061cb 135351828 ReadAge-0.1.9-windows-x64-setup.exe.from-411f0ee5782d6a222840a1f8d307ddf99fa8d3bdcfe7c39600d7192726eb7a5a.delta
          efa905cdca30205973a5da131bfc50448e195b2cffbcdddbe17308acb6cb50c0 5027 ReadAge-0.1.9-windows-x64-setup.exe.from-411f0ee5782d6a222840a1f8d307ddf99fa8d3bdcfe7c39600d7192726eb7a5a.delta.json
          2686057a00fadd3d71f182e21bad56a0283eca21f2f0017195c8a38e9efe3fbe 1740948318 ReadAge-1.0.11-android.apk
          25cde774464682c03b1f97663068a9f7d3cc4f13899dbbd90af68b9c43274f60 3053163 ReadAge-1.0.11-android.apk.from-c735f54a30c8e98fea0bdbe16a54eca543879a698601fa608c5521d20bd72737.delta
          321856e6a09b5ef19746bfd897ffc1cf88cffadb6c52542bb095dc7f9b4431e1 1726 ReadAge-1.0.11-android.apk.from-c735f54a30c8e98fea0bdbe16a54eca543879a698601fa608c5521d20bd72737.delta.json
          READAGE_FINAL_ASSETS
          printf 'All 6 pinned installer/delta assets verified on the fixed draft release.\n'
