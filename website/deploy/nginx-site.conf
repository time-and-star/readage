server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name readage.xyz www.readage.xyz;
    access_log off;
    location ^~ /.well-known/acme-challenge/ { root /var/www/readage-acme; }
    location / { return 301 https://readage.xyz$request_uri; }
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    ssl_protocols TLSv1.2 TLSv1.3;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.readage.xyz;
    access_log off;
    ssl_certificate /etc/letsencrypt/live/readage.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/readage.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://readage.xyz$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name readage.xyz;
    ssl_certificate /etc/letsencrypt/live/readage.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/readage.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ReadAgeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log /var/log/nginx/readage.access.log readage;
    error_log /var/log/nginx/readage.error.log warn;
    client_max_body_size 8k;
    client_header_timeout 10s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    limit_req zone=readage_requests burst=40 nodelay;
    limit_req zone=readage_global burst=100 nodelay;
    limit_conn readage_connections 16;
    limit_conn readage_total 128;
    location ~ "^/downloads/(ReadAge-[0-9]+\.[0-9]+\.[0-9]+-(?:windows-x64-setup\.exe|android\.apk)(?:\.from-[a-f0-9]{64}\.delta(?:\.json)?)?|SHA256SUMS\.txt)$" {
        alias /var/lib/readage-downloads/$1;
        autoindex off;
        disable_symlinks on;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe;
            text/plain txt;
            application/json json;
            application/octet-stream delta;
        }
        default_type application/octet-stream;
        # SHA-256 and byte ranges refer to the literal installer/delta representation.
        gzip off;
        # Permit ordinary multipart/resume downloads without a 429 retry loop.
        limit_req zone=readage_installers burst=32 nodelay;
        limit_req zone=readage_global burst=100 nodelay;
        limit_conn readage_connections 16;
        limit_conn readage_total 64;
    }
    location ~ "^/api/library/files/[a-f0-9]{64}$" {
        limit_req zone=readage_downloads burst=6 nodelay;
        limit_req zone=readage_global burst=100 nodelay;
        limit_conn readage_connections 4;
        limit_conn readage_total 32;
        proxy_buffering off;
        include /etc/nginx/snippets/readage-proxy.conf;
    }
    location ^~ /api/library/admin/ {
        client_max_body_size 128m;
        limit_req zone=readage_admin burst=4 nodelay;
        limit_req zone=readage_global burst=100 nodelay;
        limit_conn readage_admin_connections 1;
        limit_conn readage_admin_total 2;
        include /etc/nginx/snippets/readage-proxy.conf;
    }
    location ~ /\. { access_log off; return 404; }
    location / { include /etc/nginx/snippets/readage-proxy.conf; }
}
