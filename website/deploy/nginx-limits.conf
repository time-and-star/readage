# Loaded in nginx's http context. Trust no client-supplied forwarding headers.
server_tokens off;
limit_req_zone $binary_remote_addr zone=readage_requests:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=readage_downloads:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=readage_admin:1m rate=6r/m;
limit_req_zone $server_name zone=readage_global:1m rate=100r/s;
limit_conn_zone $binary_remote_addr zone=readage_connections:10m;
limit_conn_zone $server_name zone=readage_total:1m;
limit_req_status 429;
limit_conn_status 429;
# Avoid generating an error-log line for every rejected request in a flood.
limit_req_log_level notice;
limit_conn_log_level notice;
map $uri $readage_log_path {
    default $uri;
    "~^(.{160}).+" "$1...";
}
# Do not log query strings, credentials, message bodies or unbounded request paths.
log_format readage '$remote_addr [$time_local] "$request_method $readage_log_path $server_protocol" '
                   '$status $body_bytes_sent $request_time limit=$limit_req_status';
